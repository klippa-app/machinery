version: "2"

services:
  sut:
    container_name: machinery_sut
    image: machinery_sut:latest
    volumes:
      - "./:/go/src/github.com/RichardKnop/machinery"
    depends_on:
      - redis
    links:
      - redis
    build:
      context: .
      dockerfile: ./Dockerfile.test
    environment:
      REDIS_URL: 'redis:6379'

  redis:
    container_name: machinery_sut_redis
    image: redis
    logging:
      driver: none
